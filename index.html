<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Boy Runner</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101b35;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  color: #ffd54a;
  margin: 18px 0 8px;
}

#game {
  display: block;
  width: 95%;
  max-width: 850px;
  margin: 15px auto;
  border: 3px solid white;
  border-radius: 12px;
  background: #8bdcff;
}

p {
  color: #ddd;
}

button {
  padding: 14px 28px;
  margin: 8px;
  border: none;
  border-radius: 12px;
  background: #ffbd32;
  color: #17213b;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<h1>🏃 Cartoon Boy Runner</h1>
<p>Collect coins and avoid obstacles!</p>

<canvas id="game" width="850" height="400"></canvas>

<button id="jumpBtn">JUMP</button>
<button id="restartBtn">RESTART</button>

<p>Press SPACE or tap JUMP to play</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const ground = 330;

let boy = {
  x: 100,
  y: ground - 65,
  width: 42,
  height: 65,
  velocity: 0,
  jumping: false
};

let obstacles = [];
let coins = [];
let score = 0;
let gameOver = false;
let frame = 0;
let speed = 5;

function jump() {
  if (gameOver) {
    restart();
    return;
  }

  if (!boy.jumping) {
    boy.velocity = -15;
    boy.jumping = true;
  }
}

function restart() {
  boy.y = ground - boy.height;
  boy.velocity = 0;
  boy.jumping = false;

  obstacles = [];
  coins = [];
  score = 0;
  speed = 5;
  frame = 0;
  gameOver = false;

  loop();
}

document.getElementById("jumpBtn").addEventListener("click", jump);
document.getElementById("restartBtn").addEventListener("click", restart);

document.addEventListener("keydown", e => {
  if (e.code === "Space" || e.code === "ArrowUp") {
    e.preventDefault();
    if (!e.repeat) jump();
  }
});

function drawBoy() {
  // Head
  ctx.fillStyle = "#f5b982";
  ctx.fillRect(boy.x + 9, boy.y, 25, 25);

  // Hair
  ctx.fillStyle = "#38251d";
  ctx.fillRect(boy.x + 8, boy.y - 3, 27, 9);

  // Eyes
  ctx.fillStyle = "#222";
  ctx.fillRect(boy.x + 26, boy.y + 9, 4, 4);

  // Shirt
  ctx.fillStyle = "#ff4545";
  ctx.fillRect(boy.x + 5, boy.y + 25, 35, 25);

  // Arms
  ctx.fillStyle = "#f5b982";
  ctx.fillRect(boy.x, boy.y + 28, 7, 19);
  ctx.fillRect(boy.x + 39, boy.y + 28, 7, 19);

  // Legs
  ctx.fillStyle = "#243eae";
  ctx.fillRect(boy.x + 9, boy.y + 50, 10, 15);
  ctx.fillRect(boy.x + 27, boy.y + 50, 10, 15);

  // Shoes
  ctx.fillStyle = "#222";
  ctx.fillRect(boy.x + 5, boy.y + 62, 15, 5);
  ctx.fillRect(boy.x + 25, boy.y + 62, 15, 5);
}

function drawBackground() {
  ctx.fillStyle = "#8bdcff";
  ctx.fillRect(0, 0, 850, 400);

  // Sun
  ctx.fillStyle = "#ffdf58";
  ctx.beginPath();
  ctx.arc(740, 70, 38, 0, Math.PI * 2);
  ctx.fill();

  // Clouds
  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(170, 75, 22, 0, Math.PI * 2);
  ctx.arc(195, 65, 30, 0, Math.PI * 2);
  ctx.arc(225, 78, 22, 0, Math.PI * 2);
  ctx.fill();

  // Ground
  ctx.fillStyle = "#43b34b";
  ctx.fillRect(0, ground, 850, 70);

  ctx.fillStyle = "#25852f";
  ctx.fillRect(0, ground, 850, 8);
}

function spawnItems() {
  if (frame % 95 === 0) {
    obstacles.push({
      x: 870,
      y: ground - 38,
      width: 30,
      height: 38
    });
  }

  if (frame % 65 === 0) {
    coins.push({
      x: 870,
      y: ground - 95 - Math.random() * 45,
      radius: 11
    });
  }
}

function drawItems() {
  obstacles.forEach(o => {
    ctx.fillStyle = "#9b4d22";
    ctx.fillRect(o.x, o.y, o.width, o.height);

    ctx.fillStyle = "#c87935";
    ctx.fillRect(o.x + 5, o.y + 5, 8, 8);
  });

  coins.forEach(c => {
    ctx.fillStyle = "#ffd700";
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fff3a0";
    ctx.fillRect(c.x - 2, c.y - 6, 4, 12);
  });
}

function update() {
  if (gameOver) return;

  frame++;

  boy.velocity += 0.7;
  boy.y += boy.velocity;

  if (boy.y >= ground - boy.height) {
    boy.y = ground - boy.height;
    boy.velocity = 0;
    boy.jumping = false;
  }

  spawnItems();

  obstacles.forEach(o => {
    o.x -= speed;

    if (
      boy.x + boy.width - 5 > o.x &&
      boy.x + 5 < o.x + o.width &&
      boy.y + boy.height - 5 > o.y
    ) {
      gameOver = true;
    }
  });

  coins.forEach(c => {
    c.x -= speed;

    let dx = boy.x + 22 - c.x;
    let dy = boy.y + 30 - c.y;

    if (Math.sqrt(dx * dx + dy * dy) < 30) {
      c.collected = true;
      score += 10;
    }
  });

  obstacles = obstacles.filter(o => o.x > -50);
  coins = coins.filter(c => c.x > -30 && !c.collected);

  if (frame % 500 === 0) speed += 0.5;
}

function drawScore() {
  ctx.fillStyle = "#17213b";
  ctx.font = "bold 24px Arial";
  ctx.fillText("Score: " + score, 25, 38);
}

function drawGameOver() {
  ctx.fillStyle = "rgba(0,0,0,0.65)";
  ctx.fillRect(0, 0, 850, 400);

  ctx.fillStyle = "white";
  ctx.textAlign = "center";
  ctx.font = "bold 45px Arial";
  ctx.fillText("GAME OVER!", 425, 180);

  ctx.font = "24px Arial";
  ctx.fillText("Your Score: " + score, 425, 225);
  ctx.fillText("Press RESTART to play again", 425, 270);

  ctx.textAlign = "left";
}

function loop() {
  if (gameOver) {
    drawBackground();
    drawItems();
    drawBoy();
    drawScore();
    drawGameOver();
    return;
  }

  update();

  drawBackground();
  drawItems();
  drawBoy();
  drawScore();

  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
